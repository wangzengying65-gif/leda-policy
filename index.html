:root {
  --green-900: #123a2b;
  --green-800: #16523a;
  --green-700: #1f6b4a;
  --green-600: #2a8a5e;
  --green-100: #e7f3ec;
  --green-50: #f2f8f4;
  --ink: #1f2937;
  --ink-2: #4b5563;
  --ink-3: #6b7280;
  --line: #e5e7eb;
  --card: #ffffff;
  --bg: #f4f7f5;
  --amber: #b45309;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html { -webkit-text-size-adjust: 100%; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
    "Microsoft YaHei", "Hiragino Sans GB", sans-serif;
  background: var(--bg);
  color: var(--ink);
  line-height: 1.65;
  font-size: 15px;
}

a { color: inherit; text-decoration: none; }

/* ---------------------------------------------------------------- 顶部横幅 */
.hero {
  background: linear-gradient(135deg, var(--green-900) 0%, var(--green-700) 55%, var(--green-600) 100%);
  color: #fff;
  padding: 30px 20px 26px;
  position: relative;
  overflow: hidden;
}
.hero::after {
  content: "🌿";
  position: absolute;
  right: -10px;
  bottom: -24px;
  font-size: 110px;
  opacity: 0.14;
  transform: rotate(-12deg);
}
.hero-inner { max-width: 720px; margin: 0 auto; position: relative; z-index: 1; }
.brand { font-size: 24px; font-weight: 800; letter-spacing: 0.5px; }
.hero-sub { font-size: 13px; opacity: 0.85; margin-top: 5px; }
.hero-date { font-size: 13px; opacity: 0.9; margin-top: 12px; font-weight: 600; }

/* ---------------------------------------------------------------- 顶部导航 */
.topnav {
  background: var(--card);
  border-bottom: 1px solid var(--line);
  position: sticky;
  top: 0;
  z-index: 10;
  display: flex;
  gap: 6px;
  padding: 0 12px;
}
.topnav a {
  padding: 13px 16px;
  font-size: 15px;
  font-weight: 600;
  color: var(--ink-2);
  border-bottom: 3px solid transparent;
}
.topnav a.active {
  color: var(--green-700);
  border-bottom-color: var(--green-700);
}

/* ---------------------------------------------------------------- 主体 */
.container {
  max-width: 720px;
  margin: 0 auto;
  padding: 20px 16px 40px;
}

/* ---------------------------------------------------------------- 今日概览卡片 */
.overview-card {
  background: linear-gradient(135deg, #f0f9f4 0%, #e7f3ec 100%);
  border: 1px solid #cfe5d8;
  border-left: 4px solid var(--green-600);
  border-radius: 14px;
  padding: 18px 18px 14px;
  margin-bottom: 22px;
  box-shadow: 0 1px 3px rgba(18, 58, 43, 0.06);
}
.ov-label {
  font-size: 13px;
  font-weight: 700;
  color: var(--green-700);
  margin-bottom: 8px;
  letter-spacing: 0.5px;
}
.overview-card p {
  font-size: 15px;
  color: var(--ink);
  white-space: pre-wrap;
}
.ov-meta {
  margin-top: 10px;
  font-size: 12px;
  color: var(--green-700);
  font-weight: 600;
}

/* ---------------------------------------------------------------- 往期选择 */
.history { margin-bottom: 22px; }
.history-label {
  font-size: 13px;
  font-weight: 700;
  color: var(--ink-3);
  margin-bottom: 8px;
}
.chips {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding-bottom: 4px;
  -webkit-overflow-scrolling: touch;
}
.chip {
  flex: 0 0 auto;
  padding: 7px 14px;
  border-radius: 999px;
  background: var(--card);
  border: 1px solid var(--line);
  color: var(--ink-2);
  font-size: 13px;
  font-weight: 600;
  white-space: nowrap;
}
.chip.active {
  background: var(--green-700);
  border-color: var(--green-700);
  color: #fff;
}

/* ---------------------------------------------------------------- 排序切换 */
.sortbar {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 20px;
  flex-wrap: wrap;
}
.sortbar-label {
  font-size: 13px;
  font-weight: 700;
  color: var(--ink-3);
}

/* ---------------------------------------------------------------- 分类区块 */
.cat { margin-bottom: 28px; }
.cat-head {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 10px;
}
.cat-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: var(--accent, var(--green-600));
  flex: 0 0 auto;
}
.cat-title {
  font-size: 17px;
  font-weight: 700;
  color: var(--ink);
}
.cat-count {
  font-size: 12px;
  font-weight: 700;
  color: var(--accent, var(--green-700));
  background: var(--card);
  border: 1px solid var(--line);
  padding: 1px 8px;
  border-radius: 999px;
}

/* ---------------------------------------------------------------- 条目卡片 */
.item {
  display: block;
  background: var(--card);
  border: 1px solid var(--line);
  border-left: 3px solid var(--accent, var(--green-600));
  border-radius: 12px;
  padding: 13px 15px;
  margin-bottom: 10px;
  transition: box-shadow 0.15s ease, transform 0.15s ease;
}
.item:hover { box-shadow: 0 4px 14px rgba(18, 58, 43, 0.10); transform: translateY(-1px); }
.item-head {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 5px;
}
.item-date {
  font-size: 12px;
  color: var(--ink-3);
  font-weight: 600;
  font-variant-numeric: tabular-nums;
}
.item-title {
  font-size: 16px;
  font-weight: 600;
  color: var(--ink);
  line-height: 1.5;
}
.item-summary {
  font-size: 14px;
  color: var(--ink-2);
  margin-top: 4px;
}
.item-src {
  font-size: 12px;
  color: var(--ink-3);
  margin-top: 7px;
  display: flex;
  align-items: center;
  gap: 8px;
}

/* ---------------------------------------------------------------- 标签 */
.tag {
  display: inline-block;
  font-size: 11px;
  font-weight: 700;
  padding: 1px 8px;
  border-radius: 6px;
  white-space: nowrap;
}
.lv-nation { background: #fee2e2; color: #b91c1c; }
.lv-prov   { background: #fef3c7; color: #b45309; }
.lv-city   { background: #dbeafe; color: #1d4ed8; }

/* ---------------------------------------------------------------- 空状态 */
.empty {
  text-align: center;
  padding: 60px 20px;
  color: var(--ink-3);
}
.empty .big { font-size: 42px; display: block; margin-bottom: 12px; }

/* ---------------------------------------------------------------- 搜索框 */
.searchbar {
  display: flex;
  gap: 8px;
  margin-bottom: 20px;
}
.searchbar input {
  flex: 1;
  padding: 11px 14px;
  border: 1px solid var(--line);
  border-radius: 10px;
  font-size: 15px;
  color: var(--ink);
  background: var(--card);
}
.searchbar input:focus { outline: none; border-color: var(--green-600); }
.searchbar button {
  padding: 11px 18px;
  border: none;
  border-radius: 10px;
  background: var(--green-700);
  color: #fff;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
}
.result-count {
  font-size: 13px;
  color: var(--ink-3);
  margin-bottom: 12px;
}

/* ---------------------------------------------------------------- 页脚 */
.footer {
  text-align: center;
  color: var(--ink-3);
  font-size: 12px;
  padding: 24px 16px 32px;
}

/* ---------------------------------------------------------------- 分类主题色 */
.cat-0 { --accent: #16a34a; }  /* 盐碱地 */
.cat-1 { --accent: #65a30d; }  /* 农业 */
.cat-2 { --accent: #d97706; }  /* 中医药 */
.cat-3 { --accent: #0d9488; }  /* 生态环保 */

.cat-7 { --accent: #475569; }  /* 企业政策 */
.cat-8 { --accent: #dc2626; }  /* 资金申报 */
.cat-9 { --accent: #94a3b8; }  /* 其他 */

/* ---------------------------------------------------------------- 响应式 */
@media (max-width: 480px) {
  .brand { font-size: 22px; }
  .item-title { font-size: 15px; }
}

const CATEGORY_ORDER = DATA.category_order;
const LEVEL_CLASS = DATA.level_class;

const state = { view: 'home', report: null, q: '', sort: 'desc' };

function esc(s) {
  return (s == null ? '' : String(s)).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function d10(s) { return (s || '').slice(0, 10); }
function fmt(s) { return (s || '').replace('T', ' ').slice(0, 16); }
function idx(c) { const i = CATEGORY_ORDER.indexOf(c); return i < 0 ? 999 : i; }
function catClass(c) { return 'cat-' + Math.min(idx(c), CATEGORY_ORDER.length - 1); }
function byTimeDesc(a, b) { return (b.publish_time || '').localeCompare(a.publish_time || ''); }
function byTimeAsc(a, b) { return (a.publish_time || '').localeCompare(b.publish_time || ''); }

function groupByCat(items) {
  const g = {};
  for (const it of items) { const c = it.category || '其他'; (g[c] = g[c] || []).push(it); }
  return Object.keys(g).sort((a, b) => idx(a) - idx(b)).map(c => [c, g[c]]);
}

function emptyHtml(emoji, txt) { return '<div class="empty"><span class="big">' + emoji + '</span>' + txt + '</div>'; }

function itemHtml(it) {
  const lv = it.level ? '<span class="tag ' + (LEVEL_CLASS[it.level] || '') + '">' + esc(it.level) + '</span>' : '';
  return '<a class="item" href="' + esc(it.url) + '" target="_blank" rel="noopener">' +
    '<div class="item-head"><span class="item-date">' + d10(it.publish_time) + '</span>' + lv + '</div>' +
    '<div class="item-title">' + esc(it.title) + '</div>' +
    (it.summary ? '<div class="item-summary">' + esc(it.summary) + '</div>' : '') +
    '<div class="item-src">来源：' + esc(it.source || '—') + '</div>' +
    '</a>';
}

function renderCatSections(items) {
  if (!items.length) return emptyHtml('📭', '暂无相关政策数据');
  let h = '';
  for (const [cat, its] of groupByCat(items)) {
    h += '<section class="cat ' + catClass(cat) + '"><div class="cat-head"><span class="cat-dot"></span>' +
      '<h2 class="cat-title">' + esc(cat) + '</h2><span class="cat-count">' + its.length + '</span></div>';
    for (const it of its) h += itemHtml(it);
    h += '</section>';
  }
  return h;
}

function renderHome() {
  if (!DATA.reports.length) return emptyHtml('🌱', '暂无数据<br>等待系统完成首次采集后，这里会显示每日政策简报。');
  const rep = DATA.reports.find(r => r.crawl_time === state.report) || DATA.reports[0];
  state.report = rep.crawl_time;
  const items = DATA.items.filter(it => it.crawl_time === rep.crawl_time).sort(byTimeDesc);
  let h = '<section class="overview-card"><div class="ov-label">📌 今日概览</div>' +
    '<p>' + esc(rep.overview) + '</p>' +
    '<div class="ov-meta">本期相关 ' + rep.relevant_count + ' 条 · ' + fmt(rep.crawl_time) + '</div></section>';
  if (DATA.reports.length > 1) {
    h += '<section class="history"><div class="history-label">往期</div><div class="chips">';
    for (const r of DATA.reports) {
      h += '<a class="chip ' + (r.crawl_time === state.report ? 'active' : '') + '" data-report="' + esc(r.crawl_time) + '">' + d10(r.crawl_time) + '</a>';
    }
    h += '</div></section>';
  }
  h += renderCatSections(items);
  return h;
}

function renderAll() {
  let items = DATA.items.slice();
  const q = state.q.trim();
  if (q) items = items.filter(it => (it.title || '').indexOf(q) >= 0 || (it.summary || '').indexOf(q) >= 0 || (it.source || '').indexOf(q) >= 0);
  items.sort(state.sort === 'asc' ? byTimeAsc : byTimeDesc);
  let h = '<form class="searchbar" id="searchform"><input type="text" id="q" placeholder="搜索政策标题、摘要或来源…" value="' + esc(state.q) + '"><button type="submit">搜索</button></form>';
  if (q) h += '<div class="result-count">「' + esc(q) + '」相关结果 ' + items.length + ' 条</div>';
  h += '<div class="sortbar"><span class="sortbar-label">排序</span>' +
    '<a class="chip ' + (state.sort !== 'asc' ? 'active' : '') + '" data-sort="desc">最新优先</a>' +
    '<a class="chip ' + (state.sort === 'asc' ? 'active' : '') + '" data-sort="asc">最早优先</a></div>';
  h += items.length ? renderCatSections(items) : emptyHtml('🔍', q ? '没有找到匹配的政策' : '暂无相关政策数据');
  return h;
}

function render() {
  const app = document.getElementById('app');
  app.innerHTML = state.view === 'all' ? renderAll() : renderHome();
  document.getElementById('nav-home').className = state.view === 'all' ? '' : 'active';
  document.getElementById('nav-all').className = state.view === 'all' ? 'active' : '';
  document.querySelectorAll('.chip[data-report]').forEach(el => el.onclick = () => { state.report = el.dataset.report; render(); });
  document.querySelectorAll('.chip[data-sort]').forEach(el => el.onclick = () => { state.sort = el.dataset.sort; render(); });
  const f = document.getElementById('searchform');
  if (f) f.onsubmit = e => { e.preventDefault(); state.q = document.getElementById('q').value; render(); };
}

document.getElementById('nav-home').onclick = () => { state.view = 'home'; render(); };
document.getElementById('nav-all').onclick = () => { state.view = 'all'; render(); };
render();
</script>
